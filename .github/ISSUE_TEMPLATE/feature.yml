name: Funcionalidade
description: Sugerir uma nova funcionalidade ou melhoria
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema ou necessidade
      description: Qual dor essa funcionalidade resolve?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como você imagina a solução?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] ...
