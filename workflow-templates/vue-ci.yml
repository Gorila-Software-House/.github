name: Vue CI

on:
  pull_request:
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vue-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ["22"] # adicione "20" para cobrir as duas LTS

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # --if-present: scripts ausentes no package.json não quebram o job.
      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npm run type-check --if-present

      - name: Testes (Vitest)
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
